{% extends 'base.html' %}

{% block titulo %}Avaliar {{ restaurante.nome }} - Sabor Express{% endblock %}

{% block conteudo %}
    <h2>Avaliar {{ restaurante.nome }}</h2>

    <form method="POST">
        <label for="cliente">Seu nome</label>
        <input type="text" id="cliente" name="cliente" required>

        <label for="nota">Nota (0 a 5)</label>
        <input type="number" id="nota" name="nota" min="0" max="5" step="0.1" required>

        <button type="submit">Enviar avaliação</button>
    </form>

    <p><a href="{{ url_for('listar_avaliacoes', id_restaurante=restaurante.id) }}">Ver avaliações deste restaurante</a></p>
{% endblock %}
